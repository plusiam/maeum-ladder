<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2단계 · 역할극 카드 인쇄</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    /* ---------- A4 인쇄: 마음 친구 카드는 한 쪽에 2장, 관찰 카드·조 기록지는 한 쪽에 1장 ---------- */
    @page { size: A4; margin: 9mm 10mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #e9ecf1; font-size: 12.4px; line-height: 1.42; }
    .bar { max-width: 210mm; margin: 16px auto 12px; background: #fff; border-radius: 12px; padding: 14px 18px; }
    .bar p { margin: 0 0 8px; color: var(--ink-soft); font-size: .95rem; }
    .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .pick label { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 2px solid var(--ink); border-radius: 999px; font-family: var(--font-head); cursor: pointer; font-size: .95rem; }
    .page { width: 210mm; height: 297mm; margin: 0 auto 24px; background: #fff; padding: 9mm 10mm; box-shadow: 0 2px 10px rgba(30,42,74,.15); break-after: page; overflow: hidden; }
    .page:last-child { break-after: auto; }

    /* 마음 친구 카드 (반 쪽) */
    .card { height: 136mm; border: 2px dashed #9aa3b8; border-radius: 10px; padding: 5mm 6mm; display: flex; flex-direction: column; gap: 5px; }
    .card + .card { margin-top: 6mm; }
    .head { display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--ink); padding-bottom: 5px; }
    .no { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-family: var(--font-head); font-size: 26px; flex: 0 0 auto; }
    .head h1 { font-size: 21px; margin: 0; }
    .head p { margin: 0; color: var(--ink-soft); }
    .secret { margin-left: auto; font-family: var(--font-head); font-size: 12px; padding: 3px 10px; border: 2px dashed var(--ink); border-radius: 999px; white-space: nowrap; }
    .feelrow { display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px; }
    .box { border: 2px solid var(--ink); border-radius: 8px; padding: 5px 10px; }
    .box b, .lbl { font-family: var(--font-head); font-weight: 400; }
    .feel { font-family: var(--font-head); font-size: 23px; line-height: 1.15; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1.5px solid var(--ink); padding: 3px 7px; text-align: left; vertical-align: top; }
    th { background: #f2f4f8; font-family: var(--font-head); font-weight: 400; }
    td.k { width: 22%; font-family: var(--font-head); border-left: 8px solid var(--c); white-space: nowrap; }
    td.say { font-weight: 700; background: #fffaf0; }
    .helps { margin: 0; padding-left: 1.2em; }
    .rules { margin: 0; padding-left: 1.2em; font-size: 11px; color: var(--ink-soft); columns: 2; column-gap: 14px; }

    /* 관찰 카드 · 조 기록지 (한 쪽) */
    .full h1 { font-size: 26px; margin: 0; }
    .full h2 { font-size: 16px; margin: 10px 0 5px; }
    .full .lead { margin: 4px 0 0; color: var(--ink-soft); }
    .full td { padding: 6px 8px; }
    .obs td.look { font-size: 13px; }
    .crit { display: flex; gap: 10px; flex-wrap: wrap; }
    .crit span { border: 2px solid var(--rung3); border-radius: 999px; padding: 3px 12px; font-family: var(--font-head); }
    .tip { margin-top: 8px; padding: 8px 12px; background: #eef7f6; border-left: 6px solid var(--rung2); border-radius: 0 8px 8px 0; }
    .rnd { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px 10px; margin-top: 9px; }
    .rnd .top { display: grid; grid-template-columns: 84px 1fr 1fr 124px; gap: 10px; align-items: end; }
    .ln { border-bottom: 1.5px solid var(--ink); min-height: 36px; display: flex; align-items: flex-end; gap: 6px; font-size: 12px; white-space: nowrap; }
    .ln i { font-style: normal; color: var(--ink-soft); white-space: nowrap; }
    .rnd .hl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
    .rnd .hl .ln { min-height: 40px; }
    .rnd .wish { margin-top: 8px; }
    .foot { margin-top: auto; font-size: 10.5px; color: var(--ink-soft); display: flex; justify-content: space-between; }
    .full .foot { margin-top: 8px; }

    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { box-shadow: none; margin: 0; width: auto; height: auto; padding: 0; overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <p><b>2단계 역할극 카드</b> · 마음 친구 카드 번호는 칠판의 상황 번호와 같아요. 조마다 <b>쓸 상황 카드 한 벌 + 관찰 카드 1장 + 조 기록지 1장</b>이 필요해요. 인쇄 매수에 조 수를 넣고 '한 부씩 인쇄'를 켜요.</p>
    <div class="pick" id="pick"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="all">모두 고르기</button>
      <button class="btn" id="none">모두 빼기</button>
      <button class="btn primary" onclick="window.print()">인쇄하기</button>
    </div>
  </div>
  <div id="pages"></div>

  <script src="assets/data.js"></script>
  <script src="assets/game-data.js"></script>
  <script>
    const COLORS = ["rung0", "rung1", "rung2", "rung3"];
    const footer = (t) => `<div class="foot"><span>모든 인물과 상황은 가상이에요.</span><span>룰루랄라 한기쌤 · 마음 사다리 · ${t}</span></div>`;

    // ---------- 마음 친구 카드 (반 쪽) ----------
    function card(c) {
      const rows = [
        [0, "\"너 ~구나.\"처럼 단정하면", c.judgeReply],
        [1, "\"혹시 ~니?\"처럼 짐작을 물으면", `비밀 마음을 맞히면 “응, 맞아.” · 흔한 짐작이면 “${c.checkReply}” · 그 밖의 짐작이면 “음… 그건 아니야.”`],
        [2, "\"지금 어떤 마음이야?\"처럼 물으면", c.reveal],
        [3, "\"어떻게 도와줄까?\"처럼 물으면", c.want]
      ].map(([k, hear, reply]) => `<tr><td class="k" style="--c:var(--${COLORS[k]})">${LADDER[k].name}</td><td>${hear}</td><td class="say">“${reply.replace(/^“|”$/g, "")}”</td></tr>`).join("");
      return `<article class="card">
        <header class="head"><div class="no">${c.n}</div>
          <div><h1>${c.who} · 마음 친구 카드</h1><p>${c.view}</p></div>
          <span class="secret">다른 친구에게 보여 주지 않아요</span></header>
        <div class="feelrow">
          <div class="box"><b>비밀 마음</b><div class="feel">${c.feel}</div></div>
          <div class="box"><b>친구들이 흔히 할 짐작</b><br>${c.guess}<br><span style="color:var(--ink-soft);font-size:11px">짐작이 맞아도, 칸에 맞게 물어야 다음 대답을 해요.</span></div>
        </div>
        <table><thead><tr><th>사다리 칸</th><th>이런 말을 들으면</th><th>이렇게 대답해요</th></tr></thead><tbody>${rows}
          <tr><td class="k" style="--c:var(--ink)">칸에 안 맞으면</td><td colspan="2">말없이 고개를 저어요. 관찰자가 힌트를 줘요.</td></tr></tbody></table>
        <div class="box"><b>도울 방법을 들으면</b> 가장 마음에 드는 방법에 ★을 그려요. 내 바람과 닮은 방법이면 “그거 좋아!”<br>
          <span style="color:var(--ink-soft)">이런 방법도 좋아요: ${c.helps.join(" · ")}</span></div>
        <ul class="rules">${ACTOR_RULES.map(r => `<li>${r}</li>`).join("")}</ul>
        ${footer(c.n + "번")}
      </article>`;
    }

    // ---------- 사다리 관찰 카드 (조마다 1장, 라운드마다 넘겨 씀) ----------
    function observe() {
      return `<article class="page full obs" data-k="obs">
        <header class="head"><div class="no" style="font-size:18px">관찰</div>
          <div><h1>사다리 관찰 카드</h1><p class="lead">말 거는 친구가 칸에 맞게 말했는지 확인하고, 막히면 힌트를 하나 줘요.</p></div></header>
        <h2>칸마다 확인할 것 (아래 출발 칸부터 위로)</h2>
        <table><thead><tr><th>사다리 칸</th><th>이렇게 말했나요?</th><th>이런 말은 다시</th><th>힌트</th><th style="width:9%">통과</th></tr></thead>
          <tbody>${OBSERVE.slice().reverse().map(o => `<tr><td class="k" style="--c:var(--${COLORS[o.step]})">${LADDER[o.step].name}</td>
            <td class="look">${o.look}<br><small style="color:var(--ink-soft)">예: “${LADDER[o.step].example}”</small></td><td>${o.miss}</td><td>“${o.hint}”</td><td style="text-align:center;font-size:18px">□</td></tr>`).join("")}</tbody></table>
        <h2>도울 방법을 점검할 때 (조가 함께)</h2>
        <div class="crit">${HELP_RULE.map(q => `<span>${q}</span>`).join("")}</div>
        <p class="lead">세 가지에 모두 “네”인 방법만 조 기록지에 적어요. 친구의 바람을 바탕으로 세 가지 이상!</p>
        <div class="tip"><b>관찰자 약속</b><br>· 말 거는 친구의 말이 칸에 맞는지만 봐요. 놀리거나 대신 말해 주지 않아요.<br>· 힌트는 한 번에 하나만. 몇 번을 다시 해도 괜찮아요.<br>· ${WATCHER_WRITES}</div>
        <h2>역할 돌리기</h2>
        <table><thead><tr><th>자리</th><th>1라운드</th><th>2라운드</th><th>3라운드</th><th>4라운드</th></tr></thead><tbody>
          ${["A", "B", "C", "D"].map((s, i) => `<tr><td class="k" style="--c:var(--ink)">${s}</td>${[1, 2, 3, 4].map(r => `<td>${ROLES[(i + r - 1) % 4].name}</td>`).join("")}</tr>`).join("")}
        </tbody></table>
        <p class="lead">4인조 기준이에요. 3인조는 칠판 화면의 자리별 역할을 따라요. (마음 친구 → 말 거는 친구 → 관찰자 순서로 돌아요)</p>
        ${footer("관찰 카드")}
      </article>`;
    }

    // ---------- 조 기록지 (조마다 1장) ----------
    function record() {
      const rnd = (r) => `<div class="rnd">
        <div class="top"><div class="ln"><i>${r}라운드</i> __번</div>
          <div class="ln"><i>출발 칸에서 짐작한 마음</i></div>
          <div class="ln"><i>물어서 확인한 마음</i></div>
          <div class="ln"><i>같았나요?</i> ○ / ×</div></div>
        <div class="ln wish"><i>3층에서 들은 친구의 바람</i></div>
        <div class="hl"><div class="ln"><i>도울 방법 1</i></div><div class="ln"><i>2</i></div><div class="ln"><i>3</i></div></div>
      </div>`;
      return `<article class="page full" data-k="rec">
        <header class="head"><div class="no" style="font-size:18px">기록</div>
          <div><h1>조 기록지</h1><p class="lead">기록이(3인조는 관찰자)가 적어요. 마음 친구가 가장 마음에 든 방법에 ★을 그려요.</p></div>
          <span class="secret">______ 조</span></header>
        ${[1, 2, 3, 4].map(rnd).join("")}
        <h2>우리 조가 알게 된 것</h2>
        <div class="rnd"><div class="ln" style="min-height:30px"><i>짐작한 마음과 확인한 마음은</i></div><div class="ln" style="min-height:30px"></div></div>
        ${footer("조 기록지")}
      </article>`;
    }

    // ---------- 고르기 + 쪽 만들기 ----------
    const pick = document.getElementById("pick");
    pick.innerHTML = GAME_CARDS.map(c => `<label><input type="checkbox" value="${c.n}" checked>${c.n} ${c.who}</label>`).join("")
      + `<label><input type="checkbox" value="obs" checked>관찰 카드</label><label><input type="checkbox" value="rec" checked>조 기록지</label>`;
    function build() {
      const on = [...pick.querySelectorAll("input")].filter(i => i.checked).map(i => i.value);
      const cs = GAME_CARDS.filter(c => on.includes(String(c.n)));
      let html = "";
      for (let k = 0; k < cs.length; k += 2) html += `<section class="page">${card(cs[k])}${cs[k + 1] ? card(cs[k + 1]) : ""}</section>`;
      if (on.includes("obs")) html += observe();
      if (on.includes("rec")) html += record();
      document.getElementById("pages").innerHTML = html;
    }
    pick.onchange = build;
    document.getElementById("all").onclick = () => { pick.querySelectorAll("input").forEach(i => i.checked = true); build(); };
    document.getElementById("none").onclick = () => { pick.querySelectorAll("input").forEach(i => i.checked = false); build(); };
    build();
  </script>
</body>
</html>
